<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T04-1 SVG Scene</title>
</head>
<body>
    <svg width="800" height="500" viewBox="0 0 800 500">
        <!-- Background Sky -->
        <rect width="800" height="500" fill="#87CEEB" />
        
        <!-- House Body -->
        <rect x="250" y="250" width="300" height="200" fill="#F4A460" />
        
        <!-- Roof -->
        <polygon points="230,250 400,120 570,250" fill="#B22222" />
        
        <!-- Door -->
        <rect x="370" y="330" width="60" height="120" fill="#8B4513" />
        <circle cx="420" cy="390" r="4" fill="#FFD700" />
    </svg>
</body>
</html>
