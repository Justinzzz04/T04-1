<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; }
    figure { margin: 20px 0; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    svg { border: 1px solid #ccc; width: 100%; max-width: 800px; height: auto; }
    figcaption { text-align: center; font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>

  <figure id="scene-original">
    <svg viewBox="0 0 800 500" aria-labelledby="title-orig desc-orig">
      <title id="title-orig">House and Garden Scene</title>
      <desc id="desc-orig">An SVG drawing of a house, sky, grass, sun, cloud, tree, fence, path, and text label.</desc>

      <!-- Sky and Grass -->
      <rect x="0" y="0" width="800" height="250" fill="#78c7f0" />
      <rect x="0" y="250" width="800" height="250" fill="#60bf43" />

      <!-- Sun and Cloud -->
      <circle cx="100" cy="100" r="40" fill="#ffd700" stroke="#f0c000" stroke-width="4" />
      <ellipse cx="220" cy="90" rx="40" ry="25" fill="#ffffff" opacity="0.9" />

      <!-- Tree -->
      <rect x="630" y="310" width="20" height="40" fill="#8b5a2b" />
      <circle cx="640" cy="280" r="35" fill="#2d8a3a" />

      <!-- House Base and Roof -->
      <rect x="320" y="220" width="160" height="120" fill="#fce4c0" stroke="#8b5a2b" stroke-width="2" />
      <polygon points="300,220 400,150 500,220" fill="#aa1111" />
      
      <!-- Chimney -->
      <rect x="440" y="160" width="20" height="40" fill="#8b5a2b" />

      <!-- Door and Windows -->
      <rect x="385" y="275" width="30" height="65" fill="#c49064" stroke="#5c3a1e" />
      <line x1="340" y1="250" x2="375" y2="250" stroke="#336699" stroke-width="2" />
      <line x1="357.5" y1="235" x2="357.5" y2="265" stroke="#336699" stroke-width="2" />

      <!-- Fence -->
      <polyline points="200,340 220,320 240,340 260,320 280,340 300,320 320,340 340,320 360,340 380,320 400,340 420,320 440,340 460,320 480,340 500,320 520,340 540,320 560,340" fill="none" stroke="#ffffff" stroke-width="5" />

      <!-- Curved Path -->
      <path d="M 400 340 C 350 400, 450 450, 320 400" fill="none" stroke="#d2b48c" stroke-width="12" />

      <!-- Text -->
      <text x="400" y="480" text-anchor="middle" font-size="24" fill="#1b4d1b">Welcome to the House &amp; Garden</text>
    </svg>
    <figcaption>Original scene</figcaption>
  </figure>

</body>
</html>
